name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'art/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required CMake version
        run: sdkmanager --install "cmake;3.31.4"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Linter & Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --parallel

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel

      - name: Publish APK to rolling Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest debug build" \
            --notes "Build #${{ github.run_number }} - commit ${{ github.sha }}"
