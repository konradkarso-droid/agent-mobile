name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'art/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Правка 2026-08-24: один активный прогон на ветку.
# Причина: релизный шаг всегда пишет в ОДИН тег ci-latest (delete + create).
# Два параллельных прогона дерутся за него — один удаляет релиз, который другой
# только что создал, и получается красный крест, не означающий поломки кода.
# Побочная выгода: правки подряд перестают жечь минуты на сборки, которые
# устарели через полминуты после старта.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Правка 2026-08-26: включаем ускоритель повторной сборки C++.
    # USE_CCACHE читает gguf_lib/build.gradle.kts и только при "1" подставляет
    # ccache перед компилятором. Без этой переменной сборка идёт как раньше.
    # CCACHE_DIR задан явно, а не оставлен на умолчание: у разных версий ccache
    # умолчания разные (~/.ccache против ~/.cache/ccache), и кэш сохранялся бы
    # не из той папки, откуда его потом восстанавливают. Молча и без ошибки.
    env:
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required CMake version
        run: sdkmanager --install "cmake;3.31.4"

      # Ускоритель сборки C++. Ставится из репозиториев системы, стороннее
      # действие сознательно НЕ используется: в рабочий процесс с правом записи
      # в репозиторий не стоит пускать чужой код ради экономии минут.
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --max-size=1G
          ccache --zero-stats

      # Ключ уникален на каждый прогон, поэтому кэш дописывается всегда, а
      # restore-keys подтягивает самый свежий подходящий с прошлого раза. Это
      # обычный приём: кэш прогона неизменяем, обновить его на месте нельзя.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-native-${{ github.run_id }}
          restore-keys: |
            ccache-native-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Linter & Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --parallel

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel

      # Читаемый глазами ответ на вопрос "ускоритель вообще сработал?".
      # Смотреть строку с долей попаданий (cache hit rate). На первом прогоне
      # после этой правки она нулевая — кэш в нём только наполняется. Начиная со
      # второго должна быть высокой; если осталась нулевой, ccache к сборке не
      # подключился, и экономии нет, сколько бы прогонов ни прошло.
      # if: always() — статистика нужна и когда сборка упала, иначе диагноз
      # пришлось бы гадать.
      - name: Статистика ccache
        if: always()
        run: ccache --show-stats

      - name: Publish APK to rolling Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest debug build" \
            --notes "Build #${{ github.run_number }} - commit ${{ github.sha }}"
