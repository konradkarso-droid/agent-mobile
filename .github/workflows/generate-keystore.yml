name: Generate Debug Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass uroboros_debug \
            -keypass uroboros_debug \
            -alias uroboros_debug_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Uroboros Debug, OU=Dev, O=Uroboros, L=Unknown, S=Unknown, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 3
