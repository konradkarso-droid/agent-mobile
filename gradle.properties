android.useAndroidX=true
android.nonTransitiveRClass=true
# Память самого Gradle при сборке. По умолчанию — 512 МБ: на линтере и тестах
# вместе этого перестало хватать, и Gradle останавливался сам («сборщик мусора
# захлёбывается»). 3 ГБ — объявленное число, не подобранное: на машине сборки
# GitHub памяти 16 ГБ.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
